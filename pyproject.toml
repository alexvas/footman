[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "footman"
version = "0.1.0"
description = "Staged-snapshot privileged command dispatcher over stdio MCP"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp==1.26.0",
]

[project.scripts]
footman = "footman.startup:main"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-xdist==3.8.0", "ruff==0.17.1", "ty==0.0.73"]

[tool.hatch.build.targets.wheel]
packages = ["src/footman"]

[tool.ruff]
required-version = "==0.17.1"
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM115", "RUF100"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
